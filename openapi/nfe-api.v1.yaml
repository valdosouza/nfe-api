  /v1/nfe/voids:
    get:
      x-onda: NE-5   # D-NE166: entra com a NE-5 — ciclo da NF-e (reserva, builder, consulta, cancelamento, inutilização, DANFE/e-mail, numeração); não servida na NE-2 (sem stub 501)
      tags: [numeração]
      summary: Pedidos de inutilização do estabelecimento — PAGINADO
      parameters:
        - { name: page,     in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: envelope paginado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:       { type: boolean }
                  page:     { type: integer }
                  pageSize: { type: integer }
                  total:    { type: integer }
                  data:     { type: array, items: { $ref: '#/components/schemas/NumberVoid' } }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      x-onda: NE-5   # D-NE166: entra com a NE-5 — ciclo da NF-e (reserva, builder, consulta, cancelamento, inutilização, DANFE/e-mail, numeração); não servida na NE-2 (sem stub 501)
      tags: [numeração]
      summary: Inutiliza uma faixa de números do 55 (ato sobre a NUMERAÇÃO, nunca sobre uma nota — D-E/§3.6, D-NE8/D-NE40)
      description: >-
        Admin (D-E14). Guarda local: a faixa não pode conter nota VIVA do 55 nesta série no ERP (409 FISCAL_VOID_RANGE_IN_USE) e cabe
        em 10.000 números (201). A resposta da SEFAZ é UMA e definitiva: 102 = homologada; **563 = a faixa já tinha pedido (o retorno
        traz o nProt do pedido anterior) → pousa como inutilizada com o 563 como prova (D-NE40)**; 256 = faixa sobrepõe número já
        inutilizado (rejeição, sem nProt); demais = rejeição legível. Não existe consulta de inutilização (CONFERENCIAS 32): ambíguo
        (timeout/Fault) → reenviar a MESMA faixa é a reconciliação (o 563 fecha). Emitente sem IE: a NT 2026.007 não trata a
        inutilização (CONFERENCIAS 19 — no PR, sem credenciamento = 203). AC, BA e SP deixam de usar o pedido a partir de 01/11/2026
        (AUTORIZADORES §4 — a conferir).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serie, from, to, reason]
              additionalProperties: false
              properties:
                serie:  { type: string, pattern: '^(0|[1-9][0-9]{0,2})$' }
                year:   { type: integer, minimum: 2000, maximum: 2099, description: 'ano da inutilização (2 dígitos no Id de 43); padrão = o ano corrente na zona do estabelecimento' }
                from:   { type: integer, minimum: 1, maximum: 999999999 }
                to:     { type: integer, minimum: 1, maximum: 999999999 }
                reason: { type: string, minLength: 15, maxLength: 255, description: 'xJust (TJust 15–255)' }
      responses:
        '201':
          description: homologada (102) ou confirmada pelo 563
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/NumberVoid' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: FISCAL_VOID_RANGE_IN_USE · FISCAL_VOID_IN_FLIGHT (a mesma faixa já está em voo) · FISCAL_ISSUER_MISSING · FISCAL_CERT_*
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: FISCAL_VOID_REJECTED (256, 201, 203, 241… — `authorityCode`) · VALIDATION_FAILED (from > to, faixa > 10.000)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/AuthorityAmbiguous' }
        '503': { $ref: '#/components/responses/AuthorityUnavailable' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: O MESMO token do login do setes-api, assinado em RS256 (D-F13). A nfe-api só tem a chave pública.
  parameters:
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      description: id da nota = id do pedido no ERP (terminal 0 até a F5 — D-NE12)
  responses:
    Unauthorized:
      description: token ausente, inválido, expirado ou não-RS256
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: PRIVILEGE_REQUIRED (ramo) · INTERFACE_NOT_ALLOWED (licença — vale também para o admin) · admin exigido
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: nota/NF-e não encontrada
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Invalid:
      description: payload inválido
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: estado não permite a ação (código em `code`)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: dado de cadastro/documento inválido (campo em fields[])
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooSoon:
      description: FISCAL_QUERY_TOO_SOON — a mesma chave foi consultada há pouco (consumo indevido 656 — D-NE26); `fields[0].expected` = instante a partir do qual pode
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AuthorityAmbiguous:
      description: FISCAL_AUTHORITY_UNKNOWN_RESPONSE — resposta ilegível, trocada, SOAP Fault ou HTTP 500 (D-NE34); nada fechado
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AuthorityUnavailable:
      description: FISCAL_AUTHORITY_UNAVAILABLE — rede/timeout/serviço paralisado (108/109); a tentativa fica EM VOO (retryable)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: VALIDATION_FAILED — corpo da requisição grande demais (limite 128 kb)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE — corpo com charset ≠ UTF-8 ou Content-Encoding fora de gzip/deflate/identity
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    MasterKeyUnavailable:
      description: FISCAL_MASTER_KEY_UNAVAILABLE — chave-mestra do cofre ausente na instância
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:  { type: string }
        ref:   { type: string, description: referência do registro de crash (erro inesperado) }
        fields:
          type: array
          items:
            type: object
            properties:
              field:    { type: string }
              message:  { type: string }
              expected: { description: valor esperado quando a recusa depende de dado que mudou fora da tela }
    Health:
      type: object
      properties:
        status:    { type: string, enum: [ok, degraded] }
        db:        { type: boolean }
        masterKey: { type: boolean }
        storage:   { type: boolean }
        serverChain:
          type: object
          x-onda: NE-3
          description: 'D-NE54 a — cadeia ICP-Brasil do servidor (dado recarregável; fonte: pacote do ITI); entra com o adaptador (NE-3 — D-NE166)'
          properties:
            loaded:   { type: boolean }
            source:   { type: string, description: 'ex.: ITI ACcompactado.zip de 27/08/2026' }
        authorities:
          type: array
          x-onda: NE-3
          description: 'D-NE54 c — último consStatServ por autorizador consultado (teto de frequência ≥ 3 min); entra com o adaptador (NE-3 — D-NE166)'
          items:
            type: object
            properties:
              authorizer:  { type: string, description: 'PR, SVRS, SVAN… (AUTORIZADORES.md)' }
              environment: { type: string, enum: [H, P] }
              cStat:       { type: string, pattern: '^[0-9]{3,4}$', description: '107 = em operação; 108/109 = paralisado' }
              checkedAt:   { type: string, format: date-time }
    CertificateInfo:
      type: object
      properties:
        subject: { type: string }
        issuer: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        daysToExpire: { type: integer }
        expired: { type: boolean }
        notYetValid: { type: boolean }
        cnpj: { type: string, nullable: true }
    CertificateStatus:
      type: object
      properties:
        certificate: { type: boolean }
        privateKey: { type: boolean }
        certificateInfo: { allOf: [ { $ref: '#/components/schemas/CertificateInfo' } ], nullable: true }
    EmitterStatus:
      type: object
      properties:
        issuers:
          type: array
          items:
            type: object
            properties:
              model: { type: string, enum: [SE, '55', '65'] }
              environment: { type: string, enum: [H, P] }
              serie: { type: string, nullable: true, description: 'null no 55 — a série é do ERP (D-NE11)' }
              enabled: { type: boolean }
              authority: { type: string, enum: [ADN, SEFAZ] }
        stateRegistration:
          type: object
          x-onda: NE-3
          description: 'D-NE96 — o emitente tem IE no ERP? sem IE = contribuinte exclusivo do IBS/CBS → SVRS (NT 2026.007, H 26/10 · P 16/11/2026); deriva do autorizador (authorizers.ts — D-NE162, NE-3); na NE-2 o GET devolve só issuers + certificate'
          properties:
            present: { type: boolean }
            authorizer55: { type: string, nullable: true, description: 'autorizador derivado para o 55 neste ambiente (AUTORIZADORES.md)' }
        certificate: { $ref: '#/components/schemas/CertificateStatus' }
    Transmission:
      type: object
      description: 'uma TENTATIVA (D-NE7) — tudo o que nasce na reserva é write-once'
      properties:
        attempt: { type: integer }
        environment: { type: string, enum: [H, P] }
        accessKey: { type: string, pattern: '^[0-9]{6}[A-Z0-9]{12}[0-9]{26}$', description: 'NOSSA, cunhada na reserva (CNPJ alfanumérico aceito — NT 2026.004)' }
        authorizer: { type: string, description: 'D-NE37 — a quem a tentativa foi; toda pergunta posterior vai a ele' }
        emissionType: { type: string, enum: ['1', '6', '7'], description: 'tpEmis (6/7 = SVC — contingência fora da F4, D-NE6)' }
        stateRegistrationAbsent: { type: boolean, description: 'D-NE96 — emitente sem IE no envio; lido do XML enviado (emit/IE), nunca coluna — a coluna é o autorizador [D-NE105]' }
        dhEmi: { type: string, format: date-time }
        receipt: { type: string, nullable: true, description: 'nRec (só se P — 103/105)' }
        protocol: { type: string, nullable: true, pattern: '^([0-9]{15}|[0-9]{17})$', description: 'nProt — 15 ou 17 (NT 2025.002)' }
        dhAuthorization: { type: string, nullable: true }
        lastKind: { type: string, nullable: true, enum: [S, P, A, R, D, C, K, F, N, null] }
        lastCode: { type: string, nullable: true, description: 'cStat cru (3 ou 4 dígitos)' }
        lastMessage: { type: string, nullable: true }
    Voice:
      type: object
      properties:
        attempt: { type: integer }
        event: { type: integer }
        kind: { type: string, enum: [S, P, A, R, D, C, K, F, N] }
        authorityCode: { type: string, nullable: true, pattern: '^[0-9]{3,4}$' }
        message: { type: string, nullable: true }
        dh: { type: string, nullable: true, description: 'instante da VOZ do fisco; NULL nos fatos nossos (K da reserva, N de liberação)' }
        source: { type: string, enum: [P, Q] }
    DocumentEvent:
      type: object
      description: 'evento do DOCUMENTO no fisco (D-NE39) — identidade (tpEvento, chave, nSeqEvento), Id de 54. Na F4 (só o 110111) é DERIVADO da voz C/K/N da tentativa, com o tpEvento em authority_code (molde D-F68) — sem tabela própria até a CC-e/eventos RTC [D-NE106]'
      properties:
        eventType: { type: string, description: 'tpEvento — 110111 cancelamento no 1º release' }
        sequence: { type: integer, minimum: 1, maximum: 20 }
        kind: { type: string, enum: [K, C, N, R, F] }
        authorityCode: { type: string, nullable: true, pattern: '^[0-9]{3,4}$', description: '135/155 = registrado; 136 = sem vínculo; 573 = duplicidade' }
        protocol: { type: string, nullable: true }
        dh: { type: string, nullable: true }
    FiscalView:
      type: object
      properties:
        invoiceId: { type: integer }
        state:
          type: string
          enum: [none, in_flight, processing, authorized, denied, rejected, failed, cancelled, cancel_in_flight]
          description: 'processing = P (recibo); denied = D (nota registrada no fisco, não cancelável no fisco — D-E7)'
        authorityRecorded: { type: boolean, description: 'D-NE56 — o fisco REGISTROU a nota (protocolo — A ou D): o número está queimado' }
        currentAttempt: { type: integer, nullable: true }
        transmissions: { type: array, items: { $ref: '#/components/schemas/Transmission' } }
        voices: { type: array, items: { $ref: '#/components/schemas/Voice' } }
        documentEvents: { type: array, items: { $ref: '#/components/schemas/DocumentEvent' } }
        localCancelPending: { type: boolean, description: 'voz C (ou D) sem o C local aplicado pelo setes-api — DERIVADO (D-F28)' }
        cancelDeadline: { type: string, nullable: true, format: date-time, description: 'fim do prazo da UF (aviso — a recusa é da SEFAZ)' }
        xmlAvailable: { type: boolean }
        danfeAvailable: { type: boolean }
    TransmitResult:
      type: object
      properties:
        invoiceId: { type: integer }
        attempt: { type: integer }
        accessKey: { type: string }
        protocol: { type: string, nullable: true }
        receipt: { type: string, nullable: true }
        kind: { type: string, enum: [A, P] }
    RefreshResult:
      type: object
      properties:
        invoiceId: { type: integer }
        attempt: { type: integer }
        changed: { type: boolean }
        kind: { type: string, nullable: true }
        localCancelPending: { type: boolean }
        digestCheck: { type: string, enum: [match, mismatch, absent, not_applicable], description: 'D-NE41 — digVal do protNFe × DigestValue do XML guardado' }
    CancelResult:
      type: object
      properties:
        invoiceId: { type: integer }
        attempt: { type: integer }
        atAuthority: { type: boolean, description: 'false = a voz C já existia (idempotente)' }
        eventSequence: { type: integer }
        protocol: { type: string, nullable: true }
        warnings: { type: array, items: { type: string } }
        nextStep: { type: string, enum: [apply-local-cancel] }
    RefreshRunReport:
      type: object
      properties:
        checked: { type: integer }
        changed: { type: integer }
        stoppedEarly: { type: boolean }
        skipped: { type: boolean }
        throttled: { type: integer, description: 'candidatas puladas pelo intervalo mínimo por chave (656)' }
        circuitOpen: { type: boolean, description: 'D-NE54 b — o disjuntor CNPJ × cStat abriu nesta passada' }
        errors:
          type: array
          items:
            type: object
            properties:
              invoiceId: { type: integer }
              code: { type: string, nullable: true }
              message: { type: string }
    Numbering:
      type: object
      properties:
        serie: { type: string }
        environment: { type: string, enum: [H, P] }
        highestNumber: { type: integer, nullable: true, description: 'maior número do ERP na série (viva ou não)' }
        gaps:
          type: array
          description: 'buracos DERIVADOS (sem nota viva e fora de faixa homologada)'
          items:
            type: object
            properties:
              from: { type: integer }
              to: { type: integer }
              oldestInvoiceMonth: { type: string, nullable: true, description: 'mês do buraco — prazo legal: 10º dia do mês seguinte' }
        voids: { type: array, items: { $ref: '#/components/schemas/NumberVoid' } }
    NumberVoid:
      type: object
      description: 'pedido de inutilização (D-NE8) — uma resposta, síncrona e definitiva; nova tentativa = novo pedido'
      properties:
        id: { type: integer }
        environment: { type: string, enum: [H, P] }
        serie: { type: string }
        year: { type: integer }
        from: { type: integer }
        to: { type: integer }
        reason: { type: string }
