openapi: 3.0.3
# Contrato DESIGN-FIRST da nfe-api — NE-0 (2026-10-15; `Infra-IA/prompts/prompt_onda_nfe_sefaz.md` §13, entregável E5).
# NÃO é servido ainda: a pasta não tem código até a NE-2 (D-NE1 — esqueleto + DDL da família). Na NE-2 este arquivo vira a fonte de
# verdade das rotas (servido em /docs; teste confere rota × path — molde da nfse-api).
# Molde: `nfse-api/openapi/nfse-api.v1.yaml` (mesma casa: envelope {ok,data}, erros {error,code,ref,fields}, JWT RS256 do produto).
# Decisões: D-F4 (o app é o cliente; setes-api passivo) · D-F8 (/v1) · D-F10 (a API lê o banco do produto: o app manda só a
# REFERÊNCIA da nota) · D-F11 (o C LOCAL é do setes-api) · D-F13 (JWT RS256) · D-F14/D-F37/D-F46 (licença do ramo, inclusive admin) ·
# D-F21/D-NE11 (série e número do 55 são do ERP) · D-NE7 (vida + tentativa; chave NOSSA por tentativa, nova só com a anterior resolvida) ·
# D-NE9 (emitter do núcleo, montado pelas duas famílias) · D-NE10 (o 55 nasce virado — SEM cerca da virada) · D-NE14/D-NE56 (P e D
# no vocabulário; registro fiscal = protocolo) · D-NE25 (1º release = venda finNFe 1 + devolução finNFe 4) · D-NE33 (1 NF-e por lote,
# síncrono) · D-NE34 (Fault/500 = ambíguo) · D-NE35 (denegada guarda o procNFe) · D-NE36 (204/539) · D-NE37/D-NE96 (autorizador,
# tpEmis e presença de IE gravados na tentativa) · D-NE39 (evento por identidade tpEvento+chave+nSeq; decide o retEvento) · D-NE40
# (563 = prova da faixa) · D-NE41 (digVal) · D-NE43 (pré-validação em 3 camadas; violação = 422 com a lista INTEIRA) · D-NE53 (e-mail
# com o XML da VOZ) · D-NE54 (operação: estado por autorizador) · D-NE93 (teto de 2 MB na resposta do fisco) · D-NE100 (DANFE no
# leiaute da NT 2026.010).
# Fatos oficiais: `Infra-IA/nfe-api/integracoes/nfe-sefaz/` (README, CONFERENCIAS, AUTORIZADORES).
# Rodada 4 da nfe-api DECIDIDA em 2026-10-15 (prompt §13.10 — D-NE102…D-NE114); as marcas [D-NE…] apontam a decisão que fixou o ponto.
# NE-2 (2026-10-20 — prompt §15.8/§15.9, D-NE158…D-NE168): este contrato passa a ser SERVIDO em /docs e /v1/openapi.yaml. D-NE166: a NE-2
# serve só `GET /v1/health` (sem `authorities`/`serverChain` — NE-3) e o emitente (`GET /v1/emitter`, `PUT|DELETE /v1/emitter/certificate`,
# `PUT|DELETE /v1/emitter/issuers/{model}`); toda operação ainda NÃO servida leva `x-onda: NE-3 | NE-5` (a onda que a traz) — sem stub 501.
# A cerca rota × contrato (`src/__tests__/app.test.ts`) confere: servidas = contrato − marcadas; nada servido fora do contrato; nada marcado
# servido. Ao entregar a rota, tira-se a marca (a cerca quebra enquanto as duas coisas não andarem juntas).
info:
  title: nfe-api — NF-e modelo 55 pela SEFAZ
  version: 0.1.0-ne0
  description: >-
    Serviço da família NF-e do Gestão 2027 (porta 3003). Transmite, consulta, cancela no fisco e inutiliza faixas da NF-e (55) da nota
    de mercadoria já FATURADA no ERP — a nfe-api lê a nota, o ramo de mercadoria congelado (snapshots de item), o emitente e o
    destinatário no banco do produto (só leitura — D-F10/D-F15) e controla a conversa com a SEFAZ autorizadora (SOAP 1.2, mTLS com o A1
    do estabelecimento). A chave de 44 posições é NOSSA (cunhada na reserva da tentativa — D-NE7). O cancelamento LOCAL da nota
    (evento C, financeiro, pedido 'C' + cópia — D-E8) é do setes-api, que lê a voz C/D nas views do fiscal_api; o app orquestra (saga —
    D-NE22): nfe-api `cancel` → setes-api `POST /api/billing/cancel`.

    SEM CERCA DA VIRADA (D-NE10): o 55 nasce na nfe-api; não existe réplica do ERP para ele. A escrita do A1 (comum às famílias)
    segue as regras do emitter do núcleo.

    LICENÇA (D-F14/D-F37/D-F46): a interface do ramo (`orders` para a venda, `order-returns` para a devolução) tem de estar CONTRATADA
    para TODOS — o admin passa só o privilégio.

    Corpo: toda rota que recebe JSON responde 400 (malformado), 413 (grande demais) e 415 (charset/encoding não suportado) no envelope
    de erro — antes da autenticação; nunca 500.
servers:
  - url: http://localhost:3003
    description: dev
security:
  - BearerAuth: []
tags:
  - name: operação
  - name: emitente
  - name: nfe
  - name: numeração
paths:
  /v1/health:
    get:
      tags: [operação]
      summary: Saúde do serviço (sem autenticação) + estado por autorizador (D-NE54 c — o bloco `authorities` entra na NE-3; na NE-2 responde banco, chave-mestra e storage)
      security: []
      responses:
        '200':
          description: >-
            banco, chave-mestra, storage e a CADEIA do servidor carregada (D-NE54 a — dado recarregável) respondem; `authorities` traz o
            último `consStatServ` de cada autorizador consultado, com teto de frequência (≥ 3 min por autorizador — MOC; nunca mais que
            isso — 656). "SEFAZ-PR fora" × "defeito nosso" se lê aqui. A chave-mestra é provada abrindo UM A1 guardado por versão em
            uso (D-F243, adotada pela D-NE189) — chave errada ou rotação mal feita aparece aqui, não na 1ª emissão; a prova roda na
            partida, antes de ouvir a porta, e a cada 5 minutos, e o health só lê o último resultado (D-F245/D-F250). Um sinal só,
            `masterKey` sim ou não (D-F244): nada de versão, código ou quantidade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: >-
            alguma dependência LOCAL falhou (o corpo diz qual) — autorizador fora não derruba o health. `masterKey=false` = a chave do
            servidor não abre os A1 de alguma versão em uso (D-F243), ou não há prova recente (nunca rodou, resultado vencido, ou a
            prova não rodou — banco fora); a causa vai para o log, nunca para esta resposta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /v1/emitter:
    get:
      tags: [emitente]
      summary: Situação do emitente do token (A1 + habilitações de TODAS as famílias) — módulo do núcleo (D-NE9)
      description: >-
        Admin da institution. Habilitado = linha do modelo + A1 vigente (D-E4). As transmissões VIVAS contam todas as famílias
        instaladas (guarda do DELETE do A1 — D-NE9).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/EmitterStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/emitter/certificate:
    put:
      tags: [emitente]
      summary: Envia o A1 (.pfx + senha) — write-only (MESMA rota e regra da nfse-api — peça do núcleo, D-NE9)
      description: UM A1 por estabelecimento, serve H e P e todas as famílias (D-N31); CNPJ-base do certificado × emitente (rej. 213 confere só a base — D-NE30 segue não decidida).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pfxBase64, password]
              properties:
                pfxBase64: { type: string, maxLength: 64000 }
                password:  { type: string, maxLength: 200 }
      responses:
        '200':
          description: par gravado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/CertificateStatus' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/MasterKeyUnavailable' }
    delete:
      tags: [emitente]
      summary: Apaga o A1 — recusa com transmissão VIVA em qualquer família (409 FISCAL_ISSUER_HAS_LIVE_TRANSMISSIONS)
      responses:
        '200': { description: ok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/emitter/issuers/{model}:
    parameters:
      - name: model
        in: path
        required: true
        schema: { type: string, enum: ['55'] }
        description: a nfe-api habilita só o 55 (o 65 é da F5 — D-NE2; o SE é da nfse-api)
    put:
      tags: [emitente]
      summary: Cria/altera a habilitação do 55 — SÓ o ambiente (a série é do ERP — D-F21/D-NE11)
      description: Não troca o ambiente com transmissão viva no ambiente atual (409 FISCAL_ISSUER_HAS_LIVE_TRANSMISSIONS — D-I27 espelhada).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              additionalProperties: false
              properties:
                environment: { type: string, enum: [H, P] }
      responses:
        '200': { description: ok }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }   # FISCAL_MODEL_NOT_SUPPORTED (SE é da nfse-api; 65 da F5)
    delete:
      tags: [emitente]
      summary: Exclui a habilitação do 55 (recusa com transmissão viva)
      responses:
        '200': { description: ok }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }        # FISCAL_ISSUER_MISSING
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/nfe/invoices/pending:
    get:
      x-onda: NE-5   # D-NE166: entra com a NE-5 — ciclo da NF-e (reserva, builder, consulta, cancelamento, inutilização, DANFE/e-mail, numeração); não servida na NE-2 (sem stub 501)
      tags: [nfe]
      summary: Notas de mercadoria faturadas sem NF-e viva, autorizada ou denegada — PAGINADO (o lote é do APP)
      description: >-
        Fora da lista: última voz da vida vigente P, A, D, K ou C (a voz S não existe na família — D-NE107; a reserva sem voz é o "em
        voo" e também fica fora). Só ramos CONTRATADOS (D-F14/D-F37 — nenhum = lista vazia).
        Ordem estável (mais antiga primeiro, id).
      parameters:
        - { name: page,     in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - name: interfaceKey
          in: query
          description: 'só as notas DESTE ramo (filtro do servidor); sem o parâmetro, todos os ramos visíveis'
          schema: { type: string, enum: [orders, order-returns] }
      responses:
        '200':
          description: envelope paginado da casa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:       { type: boolean }
                  page:     { type: integer }
                  pageSize: { type: integer }
                  total:    { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        invoiceId:    { type: integer }
                        number:       { type: string }
                        serie:        { type: string }
                        dtEmission:   { type: string, format: date }
                        finality:     { type: string, enum: ['1', '4'], description: 'finNFe — D-NE25' }
                        interfaceKey: { type: string, enum: [orders, order-returns] }
        '400': { $ref: '#/components/responses/Invalid' }

  /v1/nfe/invoices/{invoiceId}:
    parameters: [ { $ref: '#/components/parameters/InvoiceId' } ]
    get:
      x-onda: NE-5   # D-NE166: entra com a NE-5 — ciclo da NF-e (reserva, builder, consulta, cancelamento, inutilização, DANFE/e-mail, numeração); não servida na NE-2 (sem stub 501)
      tags: [nfe]
      summary: Situação fiscal da nota (tentativas, vozes e eventos da VIDA vigente)
      description: Leitura exige a interface do ramo contratada. Instantes na zona do estabelecimento (Q-TZ1).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/FiscalView' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/nfe/invoices/{invoiceId}/transmit:
    parameters: [ { $ref: '#/components/parameters/InvoiceId' } ]
    post:
      x-onda: NE-5   # D-NE166: entra com a NE-5 — ciclo da NF-e (reserva, builder, consulta, cancelamento, inutilização, DANFE/e-mail, numeração); não servida na NE-2 (sem stub 501)
      tags: [nfe]
      summary: Transmite a NF-e da nota (1 NF-e por lote, síncrono — D-NE33)
      description: >-
        A nfe-api lê a nota no ERP (viva, emitida por este estabelecimento, com ramo de mercadoria, número e série do ERP — D-F21) e monta
        a NF-e 4.00 com o que está congelado no faturamento + emitente/destinatário lidos agora. Pré-validação camada 1 (D-NE43: o que a
        API deriva — chave/cNF/cDV, dhEmi × relógio, coerência de totais com o vNF do ERP (D-NE27), textos de homologação, tamanhos — + XSD)
        sobre o CANDIDATO montado em memória que a reserva grava IGUAL; violação = 422 com a lista inteira, sem tentativa. Reserva a
        tentativa sob o FOR UPDATE da nota (D-F27); a chave, o cNF, o cDV, o autorizador, o tpEmis e a presença de IE nascem NA reserva e
        são write-once (D-NE7/D-NE37/D-NE96 — emitente SEM IE vai à SVRS). Fisco FORA da transação. Privilégio TRANSMITIR na interface do
        RAMO + ramo contratado. Resposta conferida contra a pergunta (chNFe do retorno = a enviada — D-NE42). Desfecho ambíguo (timeout,
        Fault, HTTP 500, resposta ilegível — D-NE34) NÃO fecha: a tentativa fica em voo e o refresh reconcilia pela NOSSA chave.
        204 (duplicidade, mesma chave) → pousa A pela consulta; 539/204 de outra chave → D-NE36 (consultar as chaves de TODAS as
        tentativas; nunca chave nova automática).
      responses:
        '201':
          description: autorizada (voz A — 100/150) e o procNFe guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/TransmitResult' }
        '202':
          description: em processamento (voz P — 103/105, recibo em mãos; o refresh consulta o recibo após ≥ 15 s — MOC)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/TransmitResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            FISCAL_ISSUER_MISSING · FISCAL_CERT_MISSING/EXPIRED/INVALID · FISCAL_TRANSMISSION_IN_PROGRESS · FISCAL_ALREADY_AUTHORIZED ·
            FISCAL_DENIED (voz D gravada — 110/301/302/303: a nota EXISTE no fisco; não se retransmite nem se cancela no fisco — cancele a
            nota no ERP, que a mantém e leva o pedido a 'C' + cópia — D-E7/D-E8) · FISCAL_CANCEL_IN_FLIGHT · FISCAL_EFFECT_PENDING ·
            INVOICE_NOT_ISSUER (nota de terceiro) · INVOICE_LEGACY_NOT_TRANSMITTABLE (nota sincronizada do desktop) · FISCAL_NUMBER_VOIDED
            (o número está numa faixa inutilizada) · FISCAL_AUTHORITY_CHAIN_UNTRUSTED (cadeia do SERVIDOR — D-NE57) · RESOURCE_BUSY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            INVOICE_MERCHANDISE_BRANCH_MISSING · FISCAL_EMITTER_INCOMPLETE · FISCAL_RECIPIENT_INCOMPLETE · FISCAL_DOCUMENT_INVALID
            (pré-validação camada 1 + XSD — fields[] com a lista INTEIRA; nada enviado) · FISCAL_TOTALS_MOTOR_DEFECT (vNF derivado ×
            vNF do ERP fora da tolerância oficial — defeito do motor, alarme operacional — D-NE27) · FISCAL_DOCUMENT_REJECTED (voz R
            gravada — cStat de rejeição em `authorityCode`, 3 ou 4 dígitos; a nova tentativa sai com chave nova — D-NE7) ·
            FISCAL_RETURN_REFERENCE_MISSING (devolução cuja origem não tem NF-e AUTORIZADA nativa — o 1º release recusa a origem do legado, D-NE113) ·
            FISCAL_RETURN_REFERENCE_MISMATCH (o `det[nItem]` DERIVADO não confere com o procNFe arquivado da origem — cProd/qCom/vUnCom —, nunca
            chute; D-NE103: devolução referencia POR ITEM — `DFeReferenciado` chave + nItem, `refNFe` proibido, rej. 321) · FISCAL_RETURN_DUPLICATED_ITEM
            (duas linhas do mesmo item de origem — rej. 1072; a camada 2 do ERP recusa antes, D-NE112)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/AuthorityAmbiguous' }
        '503': { $ref: '#/components/responses/AuthorityUnavailable' }

  /v1/nfe/invoices/{invoiceId}/refresh:
    parameters: [ { $ref: '#/components/parameters/InvoiceId' } ]
    post:
      x-onda: NE-5   # D-NE166: entra com a NE-5 — ciclo da NF-e (reserva, builder, consulta, cancelamento, inutilização, DANFE/e-mail, numeração); não servida na NE-2 (sem stub 501)
      tags: [nfe]
      summary: Consulta o fisco pela NOSSA chave (ou pelo recibo, se P) e grava a voz nova da tentativa vigente (idempotente)
      description: >-
        Privilégio TRANSMITIR do ramo. A pergunta vai ao autorizador GRAVADO na tentativa (D-NE37). Rodízio respeita o consumo indevido
        (656: > 10 consultas da MESMA chave por hora bloqueiam o CNPJ — intervalo mínimo por chave; D-NE26) — consulta recusada pelo
        intervalo = 429 sem ir ao fisco. 217 ("NF-e não consta") numa tentativa em voo = F conclusivo (envio que não chegou). C
        descoberta aqui (cancelada em outro sistema com o mesmo A1) NÃO produz o C local — o setes-api a lê (D-F11). Reconciliação com
        prova: `digVal` do protNFe × DigestValue do XML guardado (D-NE41 — o digVal é opcional no XSD; ausente ou divergente =
        pendência crítica, nunca sobrescreve).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/RefreshResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooSoon' }
        '502': { $ref: '#/components/responses/AuthorityAmbiguous' }
        '503': { $ref: '#/components/responses/AuthorityUnavailable' }

  /v1/nfe/invoices/{invoiceId}/cancel:
    parameters: [ { $ref: '#/components/parameters/InvoiceId' } ]
    post:
      x-onda: NE-5   # D-NE166: entra com a NE-5 — ciclo da NF-e (reserva, builder, consulta, cancelamento, inutilização, DANFE/e-mail, numeração); não servida na NE-2 (sem stub 501)
      tags: [nfe]
      summary: Pede ao fisco o cancelamento da NF-e autorizada (evento 110111, 1 evento por envio — D-NE39)
      description: >-
        Só a NF-e AUTORIZADA (A) vai ao fisco; denegada (D) NÃO se cancela no fisco (409 FISCAL_DENIED — o cancelamento é local, no
        ERP); nota sem tentativa, rejeitada ou com falha → 409 FISCAL_NOT_AUTHORIZED (cancele direto no ERP). RESERVA: a voz K é
        gravada antes da chamada, sob a trava da nota (2º pedido = 409 FISCAL_CANCEL_IN_FLIGHT). Decide o cStat do `retEvento` (135/155
        = C; 136 não vinculado = ambíguo até a consulta), nunca o 128 do lote (D-NE39). Recusa do fisco (501 fora do prazo, 221
        confirmação da operação pelo destinatário, 580…) → 409 FISCAL_CANCEL_REFUSED com o código, N libera a reserva. Prazo: DADO por UF
        (`AUTORIZADORES.md` — 24 h nacional; PR 168 h) — vencido só AVISA (warnings FISCAL_CANCEL_DEADLINE); quem recusa é a SEFAZ.
        Ambíguo → o K FICA e bloqueia até a consulta reconciliar. Nota mercadoria+serviço = dois documentos: o app pede aqui e na
        nfse-api (saga — D-NE22). Privilégio CANCELAR do ramo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 15, maxLength: 255, description: 'xJust do evento (TJust 15–255 — CONFERENCIAS 6)' }
      responses:
        '200':
          description: voz C gravada (o fisco cancelou) — ou já estava (atAuthority false, idempotente)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/CancelResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            FISCAL_NOT_AUTHORIZED · FISCAL_DENIED · FISCAL_TRANSMISSION_IN_PROGRESS · FISCAL_CANCEL_IN_FLIGHT · FISCAL_CANCEL_REFUSED (N
            gravado; `authorityCode` = cStat do retEvento) · FISCAL_CERT_* / FISCAL_ISSUER_MISSING (N gravado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/AuthorityAmbiguous' }
        '503': { $ref: '#/components/responses/AuthorityUnavailable' }

  /v1/nfe/invoices/{invoiceId}/xml:
